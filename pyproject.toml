[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polychemmd"
version = "0.7.0.dev0"
description = "Independent polymer chemistry simulation platform: research-development starter"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Burhan Beycan"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
chemistry = ["rdkit==2026.9.1"]
md-smoke = ["lammps==2025.7.22.4.0", "mpich==5.0.2; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
polychemmd = "polychemmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polychemmd = ["property_catalogue.json"]
"polychemmd.forcefields" = ["alkane_parameters.json"]
