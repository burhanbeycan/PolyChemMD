name: scientific-core-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: polychemmd validate examples/pe_record.json
      - run: polychemmd torsion-describe examples/torsion_demo.json --n-grid 360 --output artifacts/torsion_demo.json
  chemistry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[chemistry]'
      - run: python -m unittest discover -s tests -v
      - run: polychemmd build-linear examples/linear_pe.json --output artifacts/linear-pe.json
      - run: polychemmd parameter-check examples/parameter_contract_demo.json --require-complete
      - run: python scripts/verify_geometry_v03.py --output-dir artifacts/geometry-ci --skip-pilots
  engine-smoke:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      UCX_TLS: self
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[chemistry,md-smoke]'
      - run: polychemmd lammps-run examples/lammps_smoke.in --run-dir artifacts/lammps-ci --expect smoke.data --output artifacts/engine-result.json
      - run: python scripts/verify_alkane_v04.py --output-dir artifacts/alkane-ci
      - run: python scripts/verify_periodic_v05.py --output-dir artifacts/periodic-ci
      - run: python scripts/verify_restart_v06.py --output-dir artifacts/restart-ci
      - run: python scripts/verify_large_cell_v07.py --output-dir artifacts/large-cell-ci
