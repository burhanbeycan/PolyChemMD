name: scientific-core-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: polychemmd validate examples/pe_record.json
      - run: polychemmd torsion-describe examples/torsion_demo.json --n-grid 360 --output artifacts/torsion_demo.json
